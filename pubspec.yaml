name: dbmaster
description: "DbMaster - AI增强数据库管理客户端"
publish_to: 'none'
version: 0.0.1+1
repository: https://github.com/hobbs136/dbmaster
issue_tracker: https://github.com/hobbs136/dbmaster/issues

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # D9（2026-08-18 拍板）：全局图标体系切 Lucide，与原型一致；
  # #31 T15 字体瘦身：vendor 到 third_party/lucide_icons_flutter——只保留 Lucide
  # 主字体（子集化）并去掉 6 个未用字重变体字体（-2.7MB），升级上游需重跑
  # tool/subset_lucide_font.dart 并核对 pubspec 字体段仍只声明 Lucide。
  lucide_icons_flutter:
    path: third_party/lucide_icons_flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  file_picker: ^8.1.1
  fl_chart: ^0.66.0
  path_provider: ^2.1.2
  decimal: ^3.2.4
  image_picker: ^1.1.1
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  flutter_markdown: ^0.7.0
  scrollable_positioned_list: ^0.3.8
  flutter_sticky_header: ^0.8.0
  flutter_isolate: ^2.0.0
  visibility_detector: ^0.4.0
  sqflite_common_ffi: ^2.3.4
  dartssh2: ^2.8.2
  excel: ^4.0.6
  window_manager: ^0.4.3
  ffi: ^2.1.3
  # pointycastle: 连接导出加密（connection_encryption_util AES）
  pointycastle: ^3.9.1
  desktop_drop: ^0.7.1
  # 直销线 buy 按钮一键打开购买页（标准插件，桌面 http URL 无需额外原生配置）
  url_launcher: ^6.3.0
  json_annotation: ^4.11.0
  # telemetry 漏斗（telemetry-funnel-plan §5）——匿名 install_uuid + SHA256 host hash
  uuid: ^4.5.1
  crypto: ^3.0.6
  # T17/T18：编辑器迁移 re_editor；本地 fork（third_party/re_editor）含补丁：
  # 自动补全触发时显示段落滞后编辑一到两帧 → caret 越界 → 上游 0.10.0 误
  # dismiss 补全弹窗（每次击键都关掉）。fork 改为有界重试。升级上游时需
  # 核对 _code_editable.dart 的 _updateAutoCompleteState 补丁是否仍必要。
  re_editor:
    path: third_party/re_editor
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  json_serializable: ^6.0.0
  bloc_test: ^9.1.7
  integration_test:
    sdk: flutter

hooks:
  user_defines:
    sqlite3:
      source: system
      # Windows 使用 winsqlite3.dll (Windows 10/11 自带)
      # macOS 使用 libsqlite3.dylib (系统自带)
      # Linux 使用 libsqlite3.so
      name_windows: winsqlite3
      name: sqlite3

flutter:
  generate: true
  uses-material-design: true