# Minimal CI for dbmaster-flutter.
#
# analyze job (ubuntu-latest), two gates on `dart analyze lib/`:
#   1. Hard gate — fail only on ERROR-level findings.
#      NOTE: the task spec wrote `--no-fatal-warnings --no-fatal-infos`, but the
#      current Dart SDK rejects the negated form ("Cannot negate option
#      --no-fatal-infos", exit 64; verified locally on the pinned SDK).
#      `--no-fatal-infos` is also the default, so the equivalent, working
#      command is `dart analyze --no-fatal-warnings` (infos non-fatal by
#      default; baseline 7 warnings / 142 infos must keep passing).
#   2. Soft gate — total finding count from `--format=machine` must stay at or
#      below the baseline. The baseline is a review-controlled variable that
#      moves with batches: update BASELINE_COUNT deliberately, never let the
#      count creep past it silently.
#
# test job: full `flutter test` (unit/widget tests under test/;
# integration_test/ is NOT part of `flutter test` and needs real DBs — out of
# scope here by design).
#
# Platform fallback (EXECUTED 2026-10-04): the ubuntu runs proved the suite
# is NOT fully platform-neutral — 3 tests are Windows-bound:
#   1. test/organisms/ai_workbench/workbench_context_picker_test.dart
#      (R2-8 connect-failure path: FileSystemException on linux)
#   2. test/organisms/sidebar/sidebar_connection_selector_failure_test.dart
#      (P1-3: exclusive file-lock open semantics do not hold on linux)
#   3. test/theme/design_system_test.dart
#      (border-radius scan of lib/: asserts on linux-only findings)
# The product is Windows-first and the local baseline (5765 passed / 0 failed
# / 1 skip) is green on Windows, so the test job runs on windows-latest
# (public repo — no billing concern). DEBT: fix the 3 tests' platform
# assumptions (registered as follow-up debt, not part of this batch); after
# that the test job can switch back to ubuntu-latest, restoring the
# libsqlite3-dev apt step that used to sit in it.
#
# SDK pin: flutter-version is pinned to the version the baselines were
# measured with (local dev SDK). First CI run on unpinned channel:stable
# failed both jobs on the NEWER SDK: dartssh2 2.14.0 no longer compiles
# (int?->num assignment tightened) breaking every test file's loading, and
# the newer analyzer counted 156 findings vs the 149 baseline. Bump the pin
# together with the local dev SDK and re-baseline the soft gate in the same
# batch.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Hard gate — no analyzer errors in lib/
        run: dart analyze --no-fatal-warnings lib/

      - name: Soft gate — analyzer finding count <= baseline
        run: |
          # Baseline at CI adoption (2026-10-04): 149 findings (0E/7W/142I).
          # 基线随批更新：this number is review-controlled and moves with
          # future batches — raise/lower it deliberately in review, and the
          # job failure names the actual count vs the baseline.
          BASELINE_COUNT=149
          count=$(dart analyze --format=machine lib/ | grep -c . || true)
          echo "analyzer findings: ${count} (baseline ${BASELINE_COUNT})"
          if [ "${count}" -gt "${BASELINE_COUNT}" ]; then
            echo "::error::analyzer findings ${count} exceed baseline ${BASELINE_COUNT} (baseline moves with batches — update deliberately)"
            exit 1
          fi

  test:
    name: test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      # No libsqlite3-dev apt step here — that was ubuntu-only (removed with
      # the fallback switch). sqlite3 FFI (the only native dependency of
      # test/) resolves against the system SQLite via the pubspec
      # hooks.user_defines config: Windows uses the OS built-in
      # winsqlite3.dll, so no package install is needed on this runner.

      - name: flutter pub get
        run: flutter pub get

      - name: flutter test (full unit/widget suite)
        run: flutter test
